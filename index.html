<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bird Farm | Supra Chain Farming Game</title>
<meta name="description" content="Bird Farm is a cozy farming game on the Supra chain. Plant crops, harvest and sell them, level up, complete quests, connect your Supra wallet and climb the leaderboard.">
<style>
:root{--bg:#5fae2e;--wood:#c98b4a;--wood2:#8a5a33;--cream:#fff6dc;--ink:#4a321a;--bar:#ffb400;--acc:#e5322d;--ok:#4caf30;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2c5a18;--cream:#f3e6c0}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:8px}
.top{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.av{width:42px;height:42px;border-radius:50%;background:var(--cream);border:3px solid var(--wood2);flex:none}
.chip{background:var(--cream);border:3px solid var(--wood2);border-radius:18px;padding:3px 9px;font-weight:800;font-size:14px;box-shadow:0 3px 0 var(--wood2);white-space:nowrap}
.lv{flex:1;min-width:0}
.lv b{font-size:12px;color:var(--cream);display:block}
.xp{height:14px;background:var(--cream);border:3px solid var(--wood2);border-radius:10px;overflow:hidden}
.xp i{display:block;height:100%;background:var(--bar);width:0}
.scene{position:relative;width:100%;aspect-ratio:100/118;border-radius:18px;overflow:hidden;border:4px solid var(--wood2);box-shadow:0 4px 0 var(--wood2)}
.scene>svg{position:absolute;inset:0;width:100%;height:100%}
.plot{position:absolute;width:15%;height:8.9%;border:0;border-radius:8px;background:#9c6234;box-shadow:inset 0 -4px 0 #7b4a26,0 2px 0 #5a3719;font-size:min(7.5vw,34px);cursor:pointer;padding:0;color:#fff}
.plot.lock{background:#6c6c5c;box-shadow:inset 0 -4px 0 #4e4e42,0 2px 0 #333;font-size:min(5vw,20px)}
.plot.rdy{animation:pop .8s infinite;outline:3px solid var(--bar)}
@keyframes pop{50%{transform:scale(1.1)}}
.plot small{position:absolute;left:12%;right:12%;bottom:6%;height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden}
.plot small i{display:block;height:100%;background:#8cf04a}
.toast{position:absolute;left:8px;right:8px;top:8px;background:var(--cream);border:3px solid var(--wood2);border-radius:14px;padding:6px 10px;font-size:13px;font-weight:700;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.sail{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.w1{animation:walk 14s ease-in-out infinite alternate}
.w2{animation:walk 19s ease-in-out infinite alternate-reverse}
@keyframes walk{to{transform:translateX(60px)}}
.seeds{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px}
.seed{flex:none;width:74px;background:var(--cream);border:3px solid var(--wood2);border-radius:14px;padding:5px 3px;text-align:center;font-size:11px;font-weight:700;color:var(--ink);box-shadow:0 3px 0 var(--wood2);cursor:pointer}
.seed.on{background:#ffe08a;border-color:var(--acc);box-shadow:0 3px 0 var(--acc)}
.seed.lock{opacity:.5}
.seed span{display:block;font-size:26px}
.nav{display:flex;gap:6px;margin-top:4px}
.nav button{flex:1;min-width:0;background:var(--wood);border:3px solid var(--wood2);border-radius:14px;padding:6px 0;font-size:11px;font-weight:800;color:#fff;box-shadow:0 3px 0 var(--wood2);cursor:pointer}
.nav button span{display:block;font-size:20px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet[hidden]{display:none}
.card{width:100%;max-width:480px;max-height:78vh;overflow-y:auto;background:var(--cream);border:4px solid var(--wood2);border-radius:20px 20px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.card h2{margin:0 0 10px;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.x{background:var(--acc);color:#fff;border:0;border-radius:50%;width:30px;height:30px;font-weight:800;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:2px dashed rgba(138,90,51,.35)}
.row .ic{font-size:30px;width:38px;text-align:center}
.row .tx{flex:1;font-size:14px}.row .tx small{display:block;opacity:.75;font-size:12px}
.btn{background:var(--ok);color:#fff;border:0;border-bottom:3px solid #2f7a1c;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:disabled{background:#999;border-color:#666}
.btn.red{background:var(--acc);border-color:#a02020}
.pb{height:8px;background:rgba(0,0,0,.15);border-radius:5px;overflow:hidden;margin-top:4px}.pb i{display:block;height:100%;background:var(--bar)}
p{font-size:14px;line-height:1.45;margin:6px 0}

.app{padding:8px 8px 14px}
.hud{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pf{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.avw{position:relative;flex:none}
.av{width:52px;height:52px;border-radius:14px;border:3px solid #fff6dc;box-shadow:0 0 0 3px var(--wood2);background:#7fc4f0}
.star{position:absolute;left:-9px;bottom:-9px;min-width:26px;height:26px;display:grid;place-items:center;background:radial-gradient(#ffe066,#ffb400);border:2px solid #fff;border-radius:50%;font-size:12px;color:#5a3719;box-shadow:0 2px 0 var(--wood2)}
.lv{flex:1;min-width:0;margin-left:6px}
.lv b{font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.xp{position:relative;height:20px;background:#5a3719;border-radius:12px}
.xp i{background:linear-gradient(#5fd0ff,#2a9be0)}
.xpt{position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;text-shadow:0 1px 1px #000}
.pill{display:flex;align-items:center;gap:6px;background:var(--cream);border:3px solid var(--wood2);border-radius:20px;box-shadow:0 3px 0 var(--wood2);font-weight:800;font-size:14px;padding:2px 3px 2px 10px;white-space:nowrap}
.plus{width:24px;height:24px;border:0;border-radius:50%;background:var(--ok);color:#fff;font-weight:900;font-size:16px;line-height:1;cursor:pointer;box-shadow:0 2px 0 #2f7a1c;padding:0}
.gear{flex:none;width:42px;height:42px;border-radius:14px;border:3px solid var(--wood2);background:var(--wood);box-shadow:0 3px 0 var(--wood2);font-size:20px;cursor:pointer;padding:0}
.cl{animation:drift 30s ease-in-out infinite alternate}@keyframes drift{to{transform:translateX(8px)}}
.plot{background:repeating-linear-gradient(0deg,#7a4a26 0 6px,#6a3f20 6px 12px);border-radius:10px;box-shadow:inset 0 0 0 3px #a8713f,0 3px 0 #4a2f18}
.plot.lock{background:#7d7d6c;box-shadow:inset 0 0 0 3px #a0a08c,0 3px 0 #3d3d33}
.plot.rdy{outline:3px solid #ffd23f;box-shadow:0 0 14px #ffd23f,inset 0 0 0 3px #a8713f}
.seeds{background:linear-gradient(#c98b4a,#a8713f);border:3px solid #6e4524;border-radius:16px;padding:8px;margin-top:10px;box-shadow:0 3px 0 #4a2f18}
.seed{border-radius:12px}
.dock{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.nav{flex:1;margin:0}
.nav button{background:linear-gradient(#e0a460,#c98b4a)}
.harv{flex:none;width:30%;border:3px solid #2f7a1c;border-radius:16px;background:linear-gradient(#6fd13f,#3f9e22);color:#fff;font-weight:900;font-size:15px;line-height:1.1;box-shadow:0 4px 0 #2f7a1c;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.harv span{display:block;font-size:26px}
.harv:active,.nav button:active,.gear:active{transform:translateY(2px)}
.nav button{font-size:10px;padding-left:2px;padding-right:2px}#inv input{width:96px;padding:6px;border-radius:8px;border:2px solid var(--wood2)}
/* ===== v2 UI: farm scene like reference ===== */
.scene{aspect-ratio:100/150;border-radius:22px;box-shadow:0 5px 0 var(--wood2),0 10px 18px rgba(0,0,0,.25)}
.hud{position:sticky;top:0;z-index:6;padding:6px 2px 8px;margin:0 0 4px;background:linear-gradient(rgba(40,90,20,.8),rgba(40,90,20,0))}
.toast{position:fixed;left:50%;right:auto;top:78px;transform:translateX(-50%);width:calc(100% - 24px);max-width:440px;z-index:20}
.side{position:absolute;left:6px;top:8px;display:flex;flex-direction:column;gap:9px;z-index:3}
.side button{position:relative;width:54px;padding:4px 0 3px;border-radius:14px;border:3px solid #c98b2a;background:linear-gradient(#ffe9a8,#f5c456);color:#4a321a;font-weight:900;font-size:10px;line-height:1.05;box-shadow:0 3px 0 #8a5a33;cursor:pointer}
.side button:active{transform:translateY(2px)}
.side button span{display:block;font-size:22px}
.side i{position:absolute;right:-7px;top:-9px;min-width:18px;height:18px;border-radius:50%;background:#e5322d;color:#fff;font-style:normal;font-size:12px;display:none;place-items:center;border:2px solid #fff}
.side i.on{display:grid}
.bar{position:sticky;bottom:0;z-index:6;margin:10px -8px 0;padding:4px 8px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(40,90,20,0),rgba(40,90,20,.92) 28%)}
.bar .seeds{margin-top:0}
.nav button{background:linear-gradient(#ffd56a,#f2a626);border-color:#b86a1c;color:#fff;font-size:12px;padding:6px 0;border-radius:16px;box-shadow:0 4px 0 #8a4a14;text-shadow:0 2px 0 #7a3f10,0 0 3px #7a3f10}
.nav button span{font-size:26px;text-shadow:none}

/* ---- people ---- */
.bob{animation:bob .45s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.35px)}}
.lg,.arm{transform-box:fill-box;transform-origin:50% 0;animation:leg .45s ease-in-out infinite alternate}
.arm{animation-name:armsw}
.l2,.a2{animation-direction:alternate-reverse}
@keyframes leg{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes armsw{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.stroll{transform-box:fill-box;transform-origin:50% 50%;animation:stroll var(--t,20s) linear infinite}
@keyframes stroll{
0%{transform:translateX(0) scaleX(1)}
49.5%{transform:translateX(var(--dx)) scaleX(1)}
50%{transform:translateX(var(--dx)) scaleX(-1)}
99.5%{transform:translateX(0) scaleX(-1)}
100%{transform:translateX(0) scaleX(1)}}

/* ---- vehicles ---- */
.drive{animation:driveR var(--t,16s) linear infinite}
.driveL{animation:driveL var(--t,16s) linear infinite}
@keyframes driveR{from{transform:translateX(-22px)}to{transform:translateX(var(--w,124px))}}
@keyframes driveL{from{transform:translateX(var(--w,124px))}to{transform:translateX(-22px)}}
.bounce{animation:bounce .38s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-.18px)}}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .45s linear infinite}

/* ---- chickens ---- */
.wander{transform-box:fill-box;transform-origin:50% 50%;animation:wander var(--t,12s) ease-in-out infinite}
@keyframes wander{
0%,10%{transform:translateX(0) scaleX(1)}
40%,49.9%{transform:translateX(var(--dx)) scaleX(1)}
50%,60%{transform:translateX(var(--dx)) scaleX(-1)}
90%,99.9%{transform:translateX(0) scaleX(-1)}
100%{transform:translateX(0) scaleX(1)}}
.ckb{animation:ckbob .5s ease-in-out infinite}
@keyframes ckbob{50%{transform:translateY(-.25px)}}
.peck{transform-box:fill-box;transform-origin:60% 95%;animation:peck 2.8s ease-in-out infinite}
@keyframes peck{0%,55%{transform:rotate(0)}62%{transform:rotate(32deg)}68%{transform:rotate(4deg)}75%{transform:rotate(30deg)}82%,100%{transform:rotate(0)}}

/* ---- nature ---- */
.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.6s ease-out infinite}
@keyframes rip{from{transform:scale(.2);opacity:.9}to{transform:scale(1.6);opacity:0}}
.bobber{animation:bobber 1.6s ease-in-out infinite}
@keyframes bobber{50%{transform:translateY(.4px)}}
.tail{transform-box:fill-box;transform-origin:100% 50%;animation:tail .3s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 3s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.puff{transform-box:fill-box;transform-origin:center;animation:puff 3.6s ease-out infinite}
@keyframes puff{from{transform:translate(0,0) scale(.5);opacity:.85}to{transform:translate(3px,-7px) scale(1.5);opacity:0}}
.bdw{animation:bdw 8s ease-in-out infinite alternate}
@keyframes bdw{to{transform:translateX(14px)}}

/* ===== desktop / landscape ===== */
.scene.desk{aspect-ratio:16/9;border-radius:26px}
.scene.desk #svgP{visibility:hidden}
.scene:not(.desk) #svgD{visibility:hidden}
.scene.desk #svgP *,.scene:not(.desk) #svgD *{animation-play-state:paused!important}
@media (min-width:900px){
.app{max-width:max(640px,min(1280px,calc((100vh - 305px)*1.7778 + 16px)))}
.plot{font-size:clamp(20px,3.4vw,46px)}
.plot.lock{font-size:clamp(14px,2.2vw,28px)}
.side{gap:12px;left:12px;top:12px}
.side button{width:66px;font-size:11px}
.side button span{font-size:28px}
.seeds{justify-content:center}
}

body{background:linear-gradient(#bfe6ff 0,#d9f2c0 38%,#a8dc72 100%) fixed}

async function fn(u,b){const r=await fetch(u,{method:'POST',headers:H,body:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
async function login(){const p=await waitProvider();if(!p)throw new Error('StarKey wallet not detected in this browser. Open the game from the StarKey app browser or a browser with the StarKey extension.');if(!st.wallet)throw new Error('Connect your wallet first');await ensureConnected(p);

let inner=r&&r.result&&typeof r.result==='object'?r.result:(r||{});
if(inner.publicKey==null){try{let a=await p.account();a=Array.isArray(a)?a[0]:a;if(a&&a.publicKey)inner={...inner,publicKey:a.publicKey}}catch(e){}}
const v=await fn(AU,{action:'verify',nonce:n.nonce,response:inner});SESS={token:v.token,address:v.address};ls('bf_sess',JSON.stringify(SESS))}
async function trade(action,x,_r){if(!SESS||nz(SESS.address)!==nz(st.wallet))await login();try{return await fn(TR,{action,token:SESS.token,...x})}catch(e){if(/not logged in/i.test(e.message)){SESS=null;try{localStorage.removeItem('bf_sess')}catch(_){}if(!_r)return trade(action,x,1)}throw e}}

if(n==='help'){T='How to play';h='<p>1. Pick a seed at the bottom, then tap an empty plot to plant it.</p><p>2. Wait for it to grow, then tap it to harvest. Harvested crops go to your Barn.</p><p>3. Sell crops in the Barn for 💎 gems (a small sale tax applies). Earn XP to level up and unlock new seeds.</p><p>4. Seeds cost 💎. Spend gems in the Shop on new plots, Super Soil, and Helper Birds. Finish Quests for small gem rewards.</p><p><b>Preview:</b> buying gems with BIRD is not open yet, so you start with 💎 1 to test the farm.</p>'}

if(a==='farm'){$('sheet').hidden=true;cur='farm';return}
if(['shop','barn','quests','lb','invest','more','help','resetq','about'].includes(a)){panel(a);return}

else if(a==='buyhelp'&&st.helpers<3&&st.gems>=helpCost()){st.gems=R4(st.gems-helpCost());st.helpers++}
else if(a==='sell'&&st.crops[i]){st.crops[i]--;{const g=R4(SEEDS[i].s*(1-TAX_SELL));st.gems=R4(st.gems+g);st.stats.earn=R4(st.stats.earn+g)}}
else if(a==='sellall'){let g=0;st.crops.forEach((c,k)=>{g+=c*SEEDS[k].s});g=R4(g*(1-TAX_SELL));st.gems=R4(st.gems+g);st.stats.earn=R4(st.stats.earn+g);st.crops=[0,0,0,0,0]}
else if(a==='claim'&&!st.claimed[i]){st.claimed[i]=1;st.gems=R4(st.gems+Q[i].m);toast('Quest reward claimed!')}
else if(a==='speed'&&st.gems>=SPEED&&st.plots[i]){st.gems=R4(st.gems-SPEED);st.plots[i].at=0;$('sheet').hidden=true}
else if(a==='qgo'&&Q[i]&&Q[i].url){window.open(Q[i].url,'_blank','noopener');st.soc[Q[i].id]=Date.now();setTimeout(()=>{if(cur==='quests'&&!$('sheet').hidden)panel('quests')},WAIT+200)}
else if(a==='harvestall'){let n=0;for(let k=0;k<st.open;k++){const q=st.plots[k];if(q&&ready(q)){harvest(k);n++}}if(!n){toast('Nothing ready to harvest yet');return}}
else if(a==='snd'){ls('bf_snd',ls('bf_snd')==='0'?'1':'0');sfxPlant();panel('more');return}
else if(a==='wallet'){connectWallet();return}
else if(a==='login'){loginFailed=false;login().then(()=>{toast('Signed in');loadInvest()}).catch(e=>toast(e.message||'Sign-in cancelled'));return}
else if(a==='sellmax'){const e=$('sellg');if(e){e.value=SELLMAX;updSellEst()}return}
else if(a==='isell'){if(SELLBUSY)return;const g=parseFloat(($('sellg')||{}).value);if(!(g>0)){toast('Enter how many gems to sell');return}if(g>SELLMAX+1e-9){toast('You only have '+SELLMAX+' 💎 to sell');return}SELLBUSY=true;trade('sell',{gems:g}).then(()=>{SELLBUSY=false;loadInvest('Sell request sent. It is paid to your wallet after review.')}).catch(e=>{SELLBUSY=false;toast(e.message)});return}
else if(a==='iquote'){const g=parseFloat(($('buyg')||{}).value);if(!(g>0)){toast('Enter how many gems to buy');return}trade('quote',{gems:g}).then(r=>{BQ=r.quote;loadInvest()}).catch(e=>toast(e.message));return}
else if(a==='ibuy'){const t=(($('txh')||{}).value||'').trim();if(!BQ||!t){toast('Paste the transaction hash');return}trade('buy',{quote_id:BQ.id,tx:t}).then(()=>{BQ=null;loadInvest('Purchase confirmed. Gems added.')}).catch(e=>toast(e.message));return}
else if(a==='iclaim'){trade('claim').then(()=>loadInvest('Claim request sent. It is paid to your wallet after review.')).catch(e=>toast(e.message));return}
else if(a==='disconnect'){disconnectWallet();return}
else if(a==='trade'){window.open(TRADE_URL,'_blank','noopener');return}
else if(a==='setname'){const v=($('nm').value||'').trim().slice(0,16);if(v){pname=v;ls('bf_name',v);lastXp=-1;sync(true)}panel('lb');return}
else if(a==='reset'){st=fresh();lastXp=-1;seeds();$('sheet').hidden=true}
save();head();paint();if(!$('sheet').hidden&&['shop','barn','quests'].includes(cur))panel(cur)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t)act(t.dataset.a,t.dataset.i)});
setInterval(()=>{let n=st.helpers;for(let i=0;i<st.open&&n>0;i++){const p=st.plots[i];if(p&&ready(p)){harvest(i);n--}}if(st.helpers){save();head()}},6000);
trees();actors();treesD();actorsD();head();seeds();buildGrid();paint();setInterval(paint,500);setInterval(badges,2000);
async function updGP(){try{if(!SB)return;const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/gem_price_status',{method:'POST',headers:H,body:'{}'});const d=await r.json();GP=d&&d.ok?'1 💎 = '+Math.round(d.bird_per_gem*(1+TAX_BUY)).toLocaleString()+' BIRD':'Gem price is paused right now.';const e=$('gp');if(e)e.textContent=GP}catch(e){}}
async function loadEcon(){try{if(!SB)return;const[a,b]=await Promise.all([fetch(SUPABASE_URL+'/rest/v1/seeds_config?select=*&order=sort',{headers:H}).then(r=>r.json()),fetch(SUPABASE_URL+'/rest/v1/economy_config?select=key,value',{headers:H}).then(r=>r.json())]);
if(Array.isArray(a))a.forEach((d,i)=>{const x=SEEDS[i];if(x){x.c=+d.cost_gems;x.t=+d.grow_secs;x.s=+d.sell_gems;x.l=+d.unlock_lvl}});
if(Array.isArray(b))b.forEach(d=>{if(d.key==='sell_tax_bps')TAX_SELL=d.value/1e4;if(d.key==='buy_tax_bps')TAX_BUY=d.value/1e4;if(d.key==='settlement_period_days')PAY_DAYS=+d.value;if(d.key==='weekly_budget_bps')BUDGET=d.value/1e4;if(d.key==='wallet_cap_bps')CAP=d.value/1e4});
seeds();head();paint()}catch(e){}}
loadEcon();restoreWallet();
if(!st.seen){st.seen=1;save();panel('help')}

/* min profit guard */
const MARGIN=1.3;{const _sd=seeds;seeds=function(){SEEDS.forEach(x=>{x.s=Math.max(x.s,R4(x.c*MARGIN))});_sd()}}
/* ===== v3 sound: synthesized SFX + ambient music (no audio files) ===== */
(()=>{
const on=()=>ls('bf_snd')!=='0',mon=()=>on()&&ls('bf_mus')!=='0';
let M,SG,MG;
function ctx(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();M=AC.createGain();M.gain.value=.9;M.connect(c);c.connect(AC.destination);SG=AC.createGain();SG.gain.value=.8;SG.connect(M);MG=AC.createGain();MG.gain.value=0;MG.connect(M)}if(AC.state==='suspended')AC.resume();return AC}
const tone=(f,t,d,ty,v,to,dst)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst||SG);o.start(t);o.stop(t+d+.05)};
const noise=(t,d,fq,v)=>{const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=fq;g.gain.value=v;s.connect(f);f.connect(g);g.connect(SG);s.start(t)};
const N=m=>440*2**((m-69)/12);
const S={
click:t=>tone(700,t,.07,'triangle',.16,420),
pop:t=>{tone(380,t,.1,'sine',.2,760);tone(760,t+.07,.1,'sine',.1)},
close:t=>tone(600,t,.09,'sine',.16,300),
plant:t=>{tone(520,t,.14,'sine',.3,180);noise(t+.02,.12,900,.3);tone(660,t+.14,.14,'triangle',.16,990)},
harvest:t=>{[72,76,79,84].forEach((m,i)=>tone(N(m),t+i*.06,.18,'triangle',.18));noise(t,.08,2500,.12)},
coin:t=>{tone(N(88),t,.12,'square',.06);tone(N(95),t+.07,.35,'square',.06);tone(N(95),t+.07,.35,'sine',.12)},
ready:t=>{tone(N(84),t,.25,'sine',.15);tone(N(91),t+.12,.35,'sine',.13)},
error:t=>{tone(200,t,.12,'square',.06,150);tone(150,t+.1,.15,'square',.06,110)},
level:t=>[72,76,79,84,88].forEach((m,i)=>{tone(N(m),t+i*.1,.3,'triangle',.2);tone(N(m)/2,t+i*.1,.3,'sine',.1)}),
chirp:t=>{const f=2200+Math.random()*900;tone(f,t,.07,'sine',.05,f*1.3);tone(f*1.2,t+.1,.07,'sine',.04,f*.9);tone(f*1.3,t+.2,.09,'sine',.04,f*1.5)},
cluck:t=>{tone(300,t,.06,'sawtooth',.035,220);tone(260,t+.09,.07,'sawtooth',.035,190)}};
const sfx=n=>{if(!on())return;try{ctx();S[n](AC.currentTime)}catch(e){}};
sfxPlant=()=>sfx('plant');
const w=(n,f)=>{const o=window[n];window[n]=function(){const r=o.apply(this,arguments);try{f.apply(null,arguments)}catch(e){}return r}};
w('harvest',()=>sfx('harvest'));w('act',a=>{if(a==='sell'||a==='sellall')setTimeout(()=>sfx('coin'),60)});
const ax=addXp;addXp=function(n){const b=lvl();ax(n);if(lvl()>b)setTimeout(()=>sfx('level'),250)};
w('toast',t=>{t=String(t);if(/^Not enough|locked|Unlock the previous|Reach level|Nothing ready|cancelled|Could not/i.test(t))sfx('error');else if(/sold|claimed|unlocked|bought|purchase|earned|added/i.test(t))sfx('coin')});
w('panel',n=>{if(n!=='farm')sfx('pop');if(n==='more'){const b=$('sb');if(b)b.insertAdjacentHTML('afterbegin','<button class="btn" data-a="mus">'+(ls('bf_mus')==='0'?'🎵 Music off':'🎵 Music on')+'</button> ')}});
document.addEventListener('pointerdown',e=>{if(on()){try{ctx()}catch(_){}}const t=e.target.closest&&e.target.closest('button,.plot,.seed');if(t)sfx(t.classList.contains('x')?'close':'click')},true);
document.addEventListener('click',e=>{const b=e.target.closest('[data-a="mus"]');if(b){ls('bf_mus',ls('bf_mus')==='0'?'1':'0');b.textContent=ls('bf_mus')==='0'?'🎵 Music off':'🎵 Music on'}});
let pr=-1;setInterval(()=>{try{const c=st.plots.slice(0,st.open).filter(p=>p&&ready(p)).length;if(pr>=0&&c>pr)sfx('ready');pr=c}catch(e){}},1000);
(function amb(){setTimeout(()=>{if(on()&&AC&&AC.state==='running'&&!document.hidden)sfx(Math.random()<.6?'chirp':'cluck');amb()},7000+Math.random()*8000)})();
const prog=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],pent=[72,74,76,79,81,84];let nb=0,nx=0,mi=2;
setInterval(()=>{if(!AC||!MG)return;MG.gain.setTargetAtTime(mon()?1:0,AC.currentTime,.3);if(!mon()||AC.state!=='running')return;const spb=60/84;if(nx<AC.currentTime)nx=AC.currentTime+.05;
while(nx<AC.currentTime+1.2){const c=prog[nb%4];c.forEach(m=>tone(N(m-12),nx,spb*4,'sine',.05,0,MG));tone(N(c[0]-24),nx,spb*2,'triangle',.07,0,MG);
for(let i=0;i<8;i++)if(Math.random()<.6){mi=Math.max(0,Math.min(5,mi+[-1,0,1,2,-2][Math.random()*5|0]));tone(N(pent[mi]),nx+i*spb/2,spb*.9,'triangle',.06,0,MG)}nx+=spb*4;nb++}},300);
document.addEventListener('visibilitychange',()=>{if(!AC)return;document.hidden?AC.suspend():(on()&&AC.resume())});
})();
</script></body></html>
